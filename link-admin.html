<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Temporary Appwrite Linker</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;color:#172033}
    input,button{font:inherit;padding:10px;margin:5px 0}
    input{width:100%;box-sizing:border-box}
    button{cursor:pointer;margin-right:8px}
    pre{background:#f4f6f8;padding:16px;white-space:pre-wrap;word-break:break-word;border-radius:8px}
    .warn{background:#fff4d6;padding:12px;border-radius:8px}
  </style>
</head>
<body>
  <h1>Temporary Appwrite Linker</h1>
  <p class="warn">Use Dry Run first. Apply only after Dry Run returns <b>ok: true</b> and zero conflicts. Delete this page and the API function after linking is complete.</p>

  <label for="secret"><b>LINK_SECRET</b></label>
  <input id="secret" type="password" autocomplete="off" placeholder="Enter the temporary LINK_SECRET configured in Vercel">

  <div>
    <button id="dry">Dry Run</button>
    <button id="apply">Apply Links</button>
  </div>

  <pre id="out">Ready.</pre>

<script>
async function run(mode) {
  const secret = document.getElementById('secret').value;
  const out = document.getElementById('out');
  if (!secret) {
    out.textContent = 'Enter LINK_SECRET first.';
    return;
  }

  if (mode === 'apply') {
    const ok = confirm('Apply all verified Appwrite links now?');
    if (!ok) return;
  }

  out.textContent = 'Working...';

  try {
    const response = await fetch('/api/link-appwrite', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-link-secret': secret
      },
      body: JSON.stringify({ mode })
    });

    const data = await response.json();
    out.textContent = JSON.stringify(data, null, 2);
  } catch (err) {
    out.textContent = String(err);
  }
}

document.getElementById('dry').onclick = () => run('dry-run');
document.getElementById('apply').onclick = () => run('apply');
</script>
</body>
</html>
