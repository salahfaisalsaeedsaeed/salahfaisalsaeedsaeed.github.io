name: Import Public Portfolio Media

on:
  push:
    branches:
      - review/final-professional-copy-v2
    paths:
      - 'tmp-media/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/final-professional-copy-v2
          fetch-depth: 0

      - name: Reassemble and verify prepared archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/public-media
          for section in awards credentials experience recommendations; do
            cat tmp-media/${section}.*.b64 | base64 --decode > /tmp/public-media/${section}.zip
          done
          echo "695a217a13530551123fb7d5807a97e5e886aa777419c8dde59e66de007a1c66  /tmp/public-media/awards.zip" | sha256sum -c -
          echo "e9e5ed3fa29dcaa2629aea4cfa62e6cc847fc2f1186bb707cb28ae36585dd2ef  /tmp/public-media/credentials.zip" | sha256sum -c -
          echo "96386fdc3ea903017afc7929a97d690773d4a0342baae53088940b32cba1b1e4  /tmp/public-media/experience.zip" | sha256sum -c -
          echo "8f6e16beeb71e9fd97ec86480b9b3961aa55e574e116c560e923e09ea914b5bf  /tmp/public-media/recommendations.zip" | sha256sum -c -

      - name: Install public display derivatives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media/assets
          for section in awards credentials experience recommendations; do
            rm -rf "media/assets/${section}"
            unzip -q /tmp/public-media/${section}.zip -d media/assets
          done
          test "$(find media/assets/awards -type f -name '*.webp' | wc -l)" -eq 5
          test "$(find media/assets/credentials -type f -name '*.webp' | wc -l)" -eq 34
          test "$(find media/assets/experience -type f -name '*.webp' | wc -l)" -eq 7
          test "$(find media/assets/recommendations -type f -name '*.webp' | wc -l)" -eq 15

      - name: Commit generated public media
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp-media
          rm -f .github/workflows/import-public-media.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/assets tmp-media .github/workflows/import-public-media.yml
          git commit -m "Add optimized public portfolio media"
          git push origin HEAD:review/final-professional-copy-v2
