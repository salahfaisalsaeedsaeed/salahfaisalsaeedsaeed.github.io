name: Export Appwrite Public Snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/export-appwrite-public-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export public table rows only
        shell: python
        run: |
          import json, urllib.parse, urllib.request, urllib.error

          ENDPOINT = "https://fra.cloud.appwrite.io/v1"
          PROJECT = "6a90545d002d8d1ed109"
          DATABASE = "6a919743003b7658ee49"
          TABLES = [
              "assets", "asset_renderings", "publications", "projects",
              "awards", "credentials", "experiences", "recommendations",
              "institutional_evidence"
          ]

          def rows(table):
              query = json.dumps({"method":"limit","values":[250]}, separators=(",", ":"))
              params = urllib.parse.urlencode({"queries[]":query,"total":"false"})
              req = urllib.request.Request(
                  f"{ENDPOINT}/tablesdb/{DATABASE}/tables/{table}/rows?{params}",
                  headers={"X-Appwrite-Project": PROJECT, "Accept":"application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = json.loads(response.read())
              except urllib.error.HTTPError as exc:
                  print(f"SNAPSHOT_ERROR|{table}|HTTP {exc.code}")
                  raise
              return data.get("rows") or data.get("documents") or []

          for table in TABLES:
              data = rows(table)
              print("SNAPSHOT|" + table + "|" + json.dumps(data, ensure_ascii=False, separators=(",", ":")))
