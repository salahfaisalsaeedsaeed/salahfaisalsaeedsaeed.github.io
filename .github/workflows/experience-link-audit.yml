name: Experience Evidence Link Audit

on:
  pull_request:
    paths:
      - '.github/workflows/experience-link-audit.yml'
      - 'script.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public experience evidence links
        shell: python
        run: |
          import json, urllib.parse, urllib.request, urllib.error

          ENDPOINT = "https://fra.cloud.appwrite.io/v1"
          PROJECT = "6a90545d002d8d1ed109"
          DATABASE = "6a919743003b7658ee49"

          def rows(table):
              query = json.dumps({"method":"limit","values":[250]}, separators=(",", ":"))
              params = urllib.parse.urlencode({"queries[]":query,"total":"false"})
              req = urllib.request.Request(
                  f"{ENDPOINT}/tablesdb/{DATABASE}/tables/{table}/rows?{params}",
                  headers={"X-Appwrite-Project": PROJECT, "Accept":"application/json"},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.loads(response.read())
              return data.get("rows") or data.get("documents") or []

          def as_list(value):
              if isinstance(value, list):
                  return [x for x in value if x]
              if not value:
                  return []
              if isinstance(value, str):
                  try:
                      parsed = json.loads(value)
                      if isinstance(parsed, list):
                          return [x for x in parsed if x]
                  except Exception:
                      pass
                  return [x.strip() for x in value.split(",") if x.strip()]
              return []

          experiences = rows("experiences")
          assets = {r.get("$id"): r for r in rows("assets") if r.get("$id")}
          renderings = {r.get("asset_id"): r for r in rows("asset_renderings") if r.get("asset_id")}

          print(f"COUNT|experiences|{len(experiences)}")
          print(f"COUNT|public_assets|{len(assets)}")
          print(f"COUNT|public_renderings|{len(renderings)}")

          for row in experiences:
              refs = []
              for field in ["asset_id", "cover_asset_id"]:
                  if row.get(field):
                      refs.append(row.get(field))
              for field in ["asset_ids", "supporting_asset_ids", "evidence_asset_ids"]:
                  refs.extend(as_list(row.get(field)))
              details = []
              for ref in refs:
                  asset = assets.get(ref)
                  rendering = renderings.get(ref)
                  details.append({
                      "ref": ref,
                      "asset_public": bool(asset),
                      "asset_title": (asset or {}).get("title"),
                      "rendering_public": bool(rendering),
                      "rendering_id": (rendering or {}).get("$id"),
                      "pages": len(as_list((rendering or {}).get("display_file_ids"))),
                  })
              print("EXPERIENCE|" + json.dumps({
                  "id": row.get("$id"),
                  "title": row.get("title"),
                  "organization": row.get("organization"),
                  "refs": refs,
                  "details": details,
              }, ensure_ascii=False))

          keywords = ("rassam", "ghad", "asbahi", "hasab", "industrial", "experience", "laboratory", "lab", "employment", "work")
          for asset_id, asset in assets.items():
              text = " ".join(str(asset.get(k) or "") for k in ["title","description","file_name","original_name"]).lower()
              if any(k in text for k in keywords):
                  rendering = renderings.get(asset_id)
                  print("CANDIDATE|" + json.dumps({
                      "asset": asset_id,
                      "title": asset.get("title"),
                      "description": asset.get("description"),
                      "rendering": (rendering or {}).get("$id"),
                      "pages": len(as_list((rendering or {}).get("display_file_ids"))),
                  }, ensure_ascii=False))
