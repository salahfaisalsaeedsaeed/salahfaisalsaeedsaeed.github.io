name: Import Prepared Public Media Package

on:
  push:
    branches:
      - review/final-professional-copy-v2
    paths:
      - 'tmp-media/GitHub_Public_Media_Ready.zip'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/final-professional-copy-v2
          fetch-depth: 0

      - name: Extract prepared public derivatives
        shell: bash
        run: |
          set -euo pipefail
          unzip -q -o tmp-media/GitHub_Public_Media_Ready.zip -d .
          test "$(find media/assets/awards -type f -name '*.webp' | wc -l)" -eq 10
          test "$(find media/assets/credentials -type f -name '*.webp' | wc -l)" -eq 29
          test "$(find media/assets/experience -type f -name '*.webp' | wc -l)" -eq 7
          test "$(find media/assets/recommendations -type f -name '*.webp' | wc -l)" -eq 15
          rm -f media/assets/awards/.gitkeep
          rm -f media/assets/credentials/.gitkeep
          rm -f media/assets/experience/.gitkeep
          rm -f media/assets/recommendations/.gitkeep

      - name: Commit public media and clean temporary importer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp-media
          rm -f .github/workflows/import-public-media-package.yml
          rm -f README_UPLOAD.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add optimized public portfolio media"
          git push origin HEAD:review/final-professional-copy-v2
