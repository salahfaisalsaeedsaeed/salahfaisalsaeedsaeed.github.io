name: Generate Presentation Video Posters

on:
  push:
    paths:
      - 'media/assets/student-videos-and-conference-presentations/*_Presentation.mp4'
      - 'scripts/generate_video_posters.py'
      - '.github/workflows/generate-video-posters.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate first-frame posters
        run: python scripts/generate_video_posters.py

      - name: Commit generated posters
        run: |
          git add media/assets/student-videos-and-conference-presentations/*_poster.webp
          if git diff --cached --quiet; then
            echo "Poster images are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate presentation video posters"
          git push
