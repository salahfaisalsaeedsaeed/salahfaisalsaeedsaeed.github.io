name: Generate PDF Preview Images

on:
  push:
    paths:
      - 'media/assets/student-videos-and-conference-presentations/*.pdf'
      - 'scripts/generate_pdf_previews.py'
      - '.github/workflows/generate-pdf-previews.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pillow

      - name: Generate first-page previews
        run: python scripts/generate_pdf_previews.py

      - name: Commit generated previews
        run: |
          git add media/assets/student-videos-and-conference-presentations/*_preview.webp
          if git diff --cached --quiet; then
            echo "Preview images are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate PDF first-page previews"
          git push
