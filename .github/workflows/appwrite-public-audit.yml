name: Appwrite Public Rendering Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'script.js'
      - '.github/workflows/appwrite-public-audit.yml'
  pull_request:
    paths:
      - 'script.js'
      - '.github/workflows/appwrite-public-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Verify every public rendering and protected original
        shell: python
        run: |
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          ENDPOINT = "https://fra.cloud.appwrite.io/v1"
          PROJECT = "6a90545d002d8d1ed109"
          DATABASE = "6a919743003b7658ee49"
          BUCKET = "academic_media"
          TABLES = [
              "assets", "asset_renderings", "publications", "projects",
              "awards", "credentials", "experiences", "recommendations",
              "institutional_evidence"
          ]

          def request(url, *, full=False):
              req = urllib.request.Request(url, headers={
                  "X-Appwrite-Project": PROJECT,
                  "Accept": "application/json",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status, response.read() if full else response.read(1)
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read() if full else exc.read(1)

          def rows(table):
              query = json.dumps({"method":"limit","values":[250]}, separators=(",", ":"))
              params = urllib.parse.urlencode({"queries[]":query,"total":"false"})
              status, body = request(
                  f"{ENDPOINT}/tablesdb/{DATABASE}/tables/{table}/rows?{params}",
                  full=True,
              )
              if status != 200:
                  raise SystemExit(f"TABLE_FAIL|{table}|HTTP {status}")
              data = json.loads(body)
              return data.get("rows") or data.get("documents") or []

          def as_list(value):
              if isinstance(value, list):
                  return [item for item in value if item]
              if not value:
                  return []
              if isinstance(value, str):
                  try:
                      parsed = json.loads(value)
                      if isinstance(parsed, list):
                          return [item for item in parsed if item]
                  except Exception:
                      pass
                  return [item.strip() for item in value.split(",") if item.strip()]
              return []

          tables = {table: rows(table) for table in TABLES}
          assets = {row.get("$id"): row for row in tables["assets"] if row.get("$id")}
          renderings = tables["asset_renderings"]
          rendering_by_asset = {}
          failures = []
          checked_display_files = 0

          print("COUNTS_BEGIN")
          for table in TABLES:
              print(f"COUNT|{table}|{len(tables[table])}")
          print("COUNTS_END")

          for rendering in renderings:
              asset_id = rendering.get("asset_id")
              display_ids = as_list(rendering.get("display_file_ids"))
              if not asset_id or asset_id not in assets:
                  failures.append(f"rendering {rendering.get('$id')} has no anonymous-readable public Asset")
                  continue
              if asset_id in rendering_by_asset:
                  failures.append(f"multiple public rendering rows found for Asset {asset_id}")
              rendering_by_asset[asset_id] = rendering
              if not display_ids:
                  failures.append(f"rendering {rendering.get('$id')} has no display_file_ids")
                  continue

              declared_pages = rendering.get("page_count")
              if declared_pages not in (None, ""):
                  try:
                      if int(declared_pages) != len(display_ids):
                          failures.append(
                              f"rendering {rendering.get('$id')} page_count={declared_pages} but has {len(display_ids)} display_file_ids"
                          )
                  except Exception:
                      failures.append(f"rendering {rendering.get('$id')} has invalid page_count={declared_pages}")

              for index, display_id in enumerate(display_ids, start=1):
                  display_url = f"{ENDPOINT}/storage/buckets/{BUCKET}/files/{urllib.parse.quote(str(display_id))}/view?project={PROJECT}"
                  status, _ = request(display_url)
                  checked_display_files += 1
                  if status != 200:
                      failures.append(
                          f"public rendering {rendering.get('$id')} display file {index}/{len(display_ids)} returned HTTP {status}"
                      )

              original_id = assets[asset_id].get("file_id")
              if original_id:
                  original_url = f"{ENDPOINT}/storage/buckets/{BUCKET}/files/{urllib.parse.quote(str(original_id))}/view?project={PROJECT}"
                  original_status, _ = request(original_url)
                  if original_status == 200:
                      failures.append(f"original file unexpectedly public for Asset {asset_id}")

          referenced_public_assets = set()
          relation_tables = [
              "publications", "projects", "awards", "credentials",
              "experiences", "institutional_evidence"
          ]
          scalar_fields = ["asset_id", "cover_asset_id"]
          list_fields = ["asset_ids", "supporting_asset_ids", "evidence_asset_ids"]
          for table in relation_tables:
              for row in tables[table]:
                  for field in scalar_fields:
                      value = row.get(field)
                      if value in assets:
                          referenced_public_assets.add(value)
                  for field in list_fields:
                      for value in as_list(row.get(field)):
                          if value in assets:
                              referenced_public_assets.add(value)

          for asset_id in sorted(referenced_public_assets):
              if asset_id not in rendering_by_asset:
                  title = assets[asset_id].get("title") or asset_id
                  failures.append(f"referenced public Asset has no public rendering: {title} ({asset_id})")

          if failures:
              print('\n'.join('FAIL|' + item for item in failures))
              raise SystemExit(1)

          print(
              f"PASS|{len(assets)} anonymous-readable Assets, "
              f"{len(renderings)} rendering rows, {checked_display_files} display files, "
              f"and {len(referenced_public_assets)} referenced public Assets verified"
          )
