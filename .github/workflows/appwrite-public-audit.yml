name: Manual Appwrite Public Rendering Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public rendering relationships and private originals
        shell: python
        run: |
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          ENDPOINT = "https://fra.cloud.appwrite.io/v1"
          PROJECT = "6a90545d002d8d1ed109"
          DATABASE = "6a919743003b7658ee49"
          BUCKET = "academic_media"
          TABLES = [
              "assets", "asset_renderings", "publications", "projects",
              "awards", "credentials", "experiences", "recommendations",
              "institutional_evidence"
          ]

          def request(url):
              req = urllib.request.Request(url, headers={
                  "X-Appwrite-Project": PROJECT,
                  "Accept": "application/json",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read()

          def rows(table):
              query = json.dumps({"method":"limit","values":[250]}, separators=(",", ":"))
              params = urllib.parse.urlencode({"queries[]":query,"total":"false"})
              status, body = request(f"{ENDPOINT}/tablesdb/{DATABASE}/tables/{table}/rows?{params}")
              if status != 200:
                  raise SystemExit(f"TABLE_FAIL|{table}|HTTP {status}")
              data = json.loads(body)
              return data.get("rows") or data.get("documents") or []

          tables = {table: rows(table) for table in TABLES}
          assets = {row.get("$id"): row for row in tables["assets"] if row.get("$id")}
          renderings = tables["asset_renderings"]
          failures = []

          print("COUNTS_BEGIN")
          for table in TABLES:
              print(f"COUNT|{table}|{len(tables[table])}")
          print("COUNTS_END")

          for rendering in renderings:
              asset_id = rendering.get("asset_id")
              display_ids = rendering.get("display_file_ids") or []
              if isinstance(display_ids, str):
                  try:
                      display_ids = json.loads(display_ids)
                  except Exception:
                      display_ids = [item.strip() for item in display_ids.split(",") if item.strip()]
              if not asset_id or asset_id not in assets:
                  failures.append(f"rendering {rendering.get('$id')} has no readable public Asset")
                  continue
              if not display_ids:
                  failures.append(f"rendering {rendering.get('$id')} has no display_file_ids")
                  continue

              display_url = f"{ENDPOINT}/storage/buckets/{BUCKET}/files/{urllib.parse.quote(str(display_ids[0]))}/view?project={PROJECT}"
              status, _ = request(display_url)
              if status != 200:
                  failures.append(f"public rendering {rendering.get('$id')} first display file returned HTTP {status}")

              original_id = assets[asset_id].get("file_id")
              if original_id:
                  original_url = f"{ENDPOINT}/storage/buckets/{BUCKET}/files/{urllib.parse.quote(str(original_id))}/view?project={PROJECT}"
                  original_status, _ = request(original_url)
                  if original_status == 200:
                      failures.append(f"original file unexpectedly public for Asset {asset_id}")

          if failures:
              print('\n'.join('FAIL|' + item for item in failures))
              raise SystemExit(1)

          print(f"PASS|{len(assets)} anonymous-readable Assets and {len(renderings)} public rendering rows audited")
