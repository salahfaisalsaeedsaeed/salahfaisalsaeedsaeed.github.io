name: Validate Site Runtime

on:
  pull_request:
    paths:
      - 'script.js'
      - 'style.css'
      - '**/*.html'
      - '.github/workflows/finalize-site.yml'
      - 'tests/**'
      - 'media/assets/**'
      - 'scripts/generate_pdf_previews.py'
  push:
    branches: [main]
    paths:
      - 'script.js'
      - 'style.css'
      - '**/*.html'
      - '.github/workflows/finalize-site.yml'
      - 'media/assets/**'
      - 'scripts/generate_pdf_previews.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax check
        run: node --check script.js

      - name: Academic color palette regression test
        run: node tests/academic-color-palette.test.js

      - name: GitHub media path regression test
        run: node tests/media-paths.test.js

      - name: GitHub media manifest coverage test
        run: node tests/media-manifest.test.js

      - name: In-site PDF viewer regression test
        run: node tests/media-pdf-viewer.test.js

      - name: Presentation video poster regression test
        run: node tests/presentation-video-posters.test.js

      - name: Student practical-training video poster regression test
        run: node tests/student-training-video-posters.test.js

      - name: Long reveal section regression test
        run: node tests/reveal-long-sections.test.js

      - name: Enforce safe Appwrite rendering architecture
        shell: python
        run: |
          from pathlib import Path
          import sys

          text = Path('script.js').read_text(encoding='utf-8')

          required = [
              'assetRenderings: "asset_renderings"',
              'display_file_ids',
              'renderingMap',
              'storageFileView(fileId)',
          ]
          forbidden = [
              'fetchPublicStorageFiles',
              'resolveStorageFile',
              'bestStorageCandidate',
              '_synthetic',
              'Open original',
              'asset.file_id',
              'assets.file_id',
          ]

          failures = []
          for token in required:
              if token not in text:
                  failures.append(f'missing required architecture token: {token}')
          for token in forbidden:
              if token in text:
                  failures.append(f'forbidden legacy/original-file token present: {token}')

          if failures:
              print('\n'.join('FAIL|' + item for item in failures))
              sys.exit(1)

          print('PASS|safe Appwrite rendering architecture checks passed')

      - name: Static internal-link and duplicate-id audit
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse
          import sys

          root = Path('.')
          html_files = [p for p in root.rglob('*.html') if '_original_current_files' not in p.parts]
          failures = []

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if 'id' in values:
                      self.ids.append(values['id'])
                  if tag == 'a' and values.get('href'):
                      self.links.append(values['href'])

          for page in html_files:
              parser = Parser()
              parser.feed(page.read_text(encoding='utf-8'))
              seen = set()
              duplicates = set()
              for value in parser.ids:
                  if value in seen:
                      duplicates.add(value)
                  seen.add(value)
              if duplicates:
                  failures.append(f'{page}: duplicate ids {sorted(duplicates)}')

              for href in parser.links:
                  if href.startswith(('http://', 'https://', 'mailto:', 'tel:', '#', 'javascript:')):
                      continue
                  parsed = urlparse(href)
                  target = parsed.path
                  if not target:
                      continue
                  fs = (root / target.lstrip('/')) if target.startswith('/') else (page.parent / target)
                  if target.endswith('/'):
                      fs = fs / 'index.html'
                  elif fs.suffix == '' and (fs / 'index.html').exists():
                      fs = fs / 'index.html'
                  if not fs.exists():
                      failures.append(f'{page}: missing internal target {href}')

          if failures:
              print('\n'.join('FAIL|' + item for item in failures))
              sys.exit(1)

          print(f'PASS|checked {len(html_files)} HTML files')
